services:
  backend:
    build:
      context: ./backend
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:-}
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
